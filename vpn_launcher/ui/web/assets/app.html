
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN ЛАУНЧЕР — by YoncFall</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0d12;
  --panel: #11161e;
  --panel-2: #151c26;
  --border: #273140;
  --text: #e8edf5;
  --muted: #818da0;
  --accent: #56a8ff;
  --accent-soft: rgba(86,168,255,.13);
  --green: #51e49b;
  --red: #ff6175;
  --radius: 10px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: transparent;
  color: var(--text);
  font-family: Bahnschrift, "Segoe UI", sans-serif;
  font-size: 12px;
}

body {
  padding: 12px 42px 12px 12px;
  background: var(--bg);
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
  cursor: pointer;
}

button:focus-visible,
input:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: 2px;
}

#app-shell {
  position: relative;
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
}

#window {
  position: relative;
  isolation: isolate;
  overflow: visible;
  border: 1px solid transparent;
  border-radius: 12px;
  background:
    linear-gradient(var(--bg), var(--bg)) padding-box,
    linear-gradient(112deg,
      rgba(255, 83, 224, .92) 0%,
      rgba(154, 86, 255, .82) 24%,
      rgba(76, 221, 255, .92) 49%,
      rgba(139, 87, 255, .78) 73%,
      rgba(255, 83, 224, .92) 100%) border-box;
  box-shadow: 0 18px 55px rgba(0,0,0,.42);
}

/* Тонкая неоновая кайма по самому краю окна с мягким свечением наружу. */
#window::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -1px;
  border-radius: inherit;
  background: linear-gradient(112deg,
    rgba(255, 73, 222, .38),
    rgba(145, 76, 255, .30) 25%,
    rgba(63, 215, 255, .36) 52%,
    rgba(145, 76, 255, .28) 76%,
    rgba(255, 73, 222, .38));
  filter: blur(9px);
  opacity: .72;
  pointer-events: none;
}

.titlebar {
  height: 45px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  border-radius: 12px 12px 0 0;
  background: #10151d;
}

.brand-mark {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(86,168,255,.35);
  border-radius: 7px;
  color: var(--accent);
  background: var(--accent-soft);
}

.brand-mark svg {
  width: 15px;
  height: 15px;
}

.brand-name {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.25px;
}

.brand-subtitle {
  margin-left: 2px;
  color: #647185;
  font-size: 9px;
  letter-spacing: 1.1px;
}

.titlebar-spacer {
  flex: 1;
}

.window-light {
  width: 7px;
  height: 7px;
  margin-right: 4px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 9px rgba(81,228,155,.6);
}

.window-control {
  width: 27px;
  height: 27px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #8d98a9;
}

.window-control:hover {
  background: #202835;
  color: var(--text);
}

.window-control.close:hover {
  color: white;
  background: #a93345;
}

.window-control svg {
  width: 13px;
  height: 13px;
}

.content {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 11px;
}

.section {
  min-width: 0;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(145deg, rgba(21,28,38,.96), rgba(15,20,28,.98));
}

.section-heading {
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: #c5cfdd;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.05px;
  text-transform: uppercase;
}

.section-heading svg {
  width: 13px;
  height: 13px;
  color: var(--accent);
}

.subscription-row {
  display: flex;
  align-items: stretch;
  gap: 7px;
}

.subscription-input-wrap {
  position: relative;
  min-width: 0;
  flex: 1;
}

.text-input {
  width: 100%;
  height: 31px;
  padding: 0 10px;
  border: 1px solid #303b4a;
  border-radius: 6px;
  background: #0b1017;
  color: #dfe8f4;
  outline: none;
}

.text-input::placeholder {
  color: #5d697b;
}

.text-input:focus {
  border-color: #467fb6;
  background: #0d131c;
}

#subscriptionUrl {
  padding-right: 35px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 10px;
}

.eye-button {
  position: absolute;
  top: 0;
  right: 0;
  width: 32px;
  height: 31px;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  color: #7f8da1;
}

.eye-button:hover {
  color: var(--text);
}

.eye-button svg {
  width: 14px;
  height: 14px;
}

.ghost-button,
.secondary-button,
.primary-button,
.danger-button {
  min-width: 0;
  height: 31px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  border: 1px solid #303b4a;
  border-radius: 6px;
  background: #171e28;
  color: #b9c5d5;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .15px;
  transition: background .15s, border-color .15s, color .15s;
}

.ghost-button:hover,
.secondary-button:hover {
  border-color: #46556a;
  background: #202a38;
  color: var(--text);
}

.ghost-button svg,
.secondary-button svg,
.primary-button svg,
.danger-button svg {
  width: 13px;
  height: 13px;
  flex: 0 0 auto;
}

.subscription-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 8px;
}

.subscription-actions .ghost-button {
  flex: 1;
}

.servers-hint {
  margin: -2px 0 8px;
  color: var(--muted);
  font-size: 10px;
}

.server-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.server-table th {
  height: 24px;
  padding: 0 8px;
  border-bottom: 1px solid #2a3442;
  color: #758297;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .8px;
  text-align: left;
}

.server-table th:first-child {
  width: 95px;
}

.server-table th:last-child {
  width: 65px;
  text-align: right;
}

.server-table td {
  height: 31px;
  padding: 0 8px;
  overflow: hidden;
  border-bottom: 1px solid rgba(43,53,68,.65);
  color: #bdc8d7;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.server-table tr:last-child td {
  border-bottom: 0;
}

.server-row {
  cursor: pointer;
  transition: background .12s;
}

.server-row:hover {
  background: rgba(86,168,255,.06);
}

.server-row.selected {
  background: rgba(86,168,255,.1);
}

.server-row.selected td:first-child {
  box-shadow: inset 2px 0 var(--accent);
}

.protocol {
  color: #8bbfff;
  font-size: 10px;
  font-weight: 700;
}

.ping {
  text-align: right;
  font-family: Consolas, "Courier New", monospace;
  font-size: 10px;
}

.ping.good {
  color: var(--green);
}

.ping.medium {
  color: #e8c46c;
}

.ping.bad {
  color: var(--red);
}

.empty-row td {
  height: 43px;
  color: #6e7b8e;
  text-align: center;
  font-size: 10px;
}

.mode-segments,
.exception-segments {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px;
  padding: 3px;
  border: 1px solid #283343;
  border-radius: 8px;
  background: #0b1017;
}

.segment {
  min-width: 0;
  min-height: 30px;
  padding: 5px 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: #8996a9;
  font-size: 10px;
  font-weight: 700;
  text-align: center;
}

.segment:hover {
  color: #d7e2f1;
  background: rgba(255,255,255,.025);
}

.segment.active {
  border-color: #345c83;
  background: #182b40;
  color: #a8d3ff;
  box-shadow: inset 0 0 0 1px rgba(86,168,255,.05);
}

.segment input {
  width: 12px;
  height: 12px;
  margin: 0;
  accent-color: var(--accent);
  flex: 0 0 auto;
}

.exceptions-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 9px;
  margin-top: 9px;
}

.process-list-wrap {
  min-width: 0;
}

.process-list {
  height: 111px;
  padding: 4px;
  overflow: auto;
  border: 1px solid #2b3544;
  border-radius: 6px;
  background: #0b1017;
}

.process-item {
  min-height: 25px;
  padding: 5px 7px;
  display: flex;
  align-items: center;
  gap: 7px;
  overflow: hidden;
  border: 1px solid transparent;
  border-radius: 4px;
  color: #aebacc;
  cursor: pointer;
  font-family: Consolas, "Courier New", monospace;
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.process-item:hover {
  background: #161f2b;
}

.process-item.selected {
  border-color: #2e5276;
  background: #17283b;
  color: #b9dcff;
}

.process-item .process-dot {
  width: 5px;
  height: 5px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #5e7189;
}

.process-item.selected .process-dot {
  background: var(--accent);
  box-shadow: 0 0 6px rgba(86,168,255,.45);
}

.process-picker {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.process-picker .text-input {
  font-size: 10px;
}

.add-button {
  width: 100%;
}

.process-bottom-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}

.process-bottom-actions button {
  width: 100%;
}

.section-hint {
  margin: 9px 0 0;
  color: #748196;
  font-size: 10px;
}

.connection-section {
  padding: 11px;
  border-color: #2d4055;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(54,110,170,.09), transparent 72%),
    linear-gradient(145deg, #131b26, #10161f);
}

.connection-section .section-heading {
  margin-bottom: 9px;
}

.connection-section .mode-segments {
  margin-bottom: 8px;
}

.connection-buttons {
  display: grid;
  grid-template-columns: 1.08fr .86fr 1fr;
  gap: 7px;
}

.primary-button,
.danger-button,
.secondary-button {
  height: 34px;
  padding: 0 8px;
  font-size: 10px;
}

.primary-button {
  border-color: #438fe0;
  background: linear-gradient(180deg, #3188e4, #2167b3);
  color: #fff;
  box-shadow: 0 3px 12px rgba(38,117,197,.17);
}

.primary-button:hover {
  border-color: #6cb3ff;
  background: linear-gradient(180deg, #4399f0, #2878ca);
}

.danger-button {
  border-color: #60303b;
  background: #291a22;
  color: #f28a99;
}

.danger-button:hover:not(:disabled) {
  border-color: #a34b5b;
  background: #3a202b;
  color: #ffacb8;
}

button:disabled {
  cursor: not-allowed;
  opacity: .38;
  filter: saturate(.55);
}

.connection-status {
  min-height: 27px;
  margin-top: 8px;
  padding: 5px 1px 0;
  display: flex;
  align-items: center;
  gap: 13px;
  border-top: 1px solid rgba(47,61,79,.7);
}

.status-group {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
}

.status-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #9eacbf;
  font-size: 10px;
  white-space: nowrap;
}

.status-lamp {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #667386;
  box-shadow: 0 0 0 2px rgba(102,115,134,.09);
}

.status-lamp.ready {
  background: var(--green);
  box-shadow: 0 0 8px rgba(81,228,155,.45);
}

.status-lamp.connecting {
  background: #e8c46c;
  box-shadow: 0 0 8px rgba(232,196,108,.35);
}

.status-lamp.error {
  background: var(--red);
  box-shadow: 0 0 8px rgba(255,97,117,.35);
}

.status-lamp.dpi-active {
  background: var(--green);
  box-shadow: 0 0 8px rgba(81,228,155,.5);
}

.status-lamp.dpi-inactive {
  background: #667386;
  box-shadow: none;
}

.external-ip {
  min-width: 0;
  margin-left: auto;
  overflow: hidden;
  color: #8f9caf;
  font-family: Consolas, "Courier New", monospace;
  font-size: 10px;
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#rocket {
  position: absolute;
  z-index: 10;
  top: 51%;
  left: calc(100% - 1px);
  width: 69px;
  min-height: 81px;
  padding: 10px 7px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid #344256;
  border-left-color: #40536b;
  border-radius: 0 10px 10px 0;
  background: linear-gradient(145deg, #17212e, #101720);
  color: #93a5ba;
  box-shadow: 7px 6px 18px rgba(0,0,0,.28);
  transform: translateY(-50%);
  transition: color .18s, border-color .18s, box-shadow .18s, background .18s;
}

#rocket:hover {
  border-color: #52718f;
  color: #c7e3ff;
}

#rocket svg {
  width: 23px;
  height: 23px;
}

#rocket .rocket-label {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1px;
}

#rocket.active {
  border-color: #3eab7a;
  background: linear-gradient(145deg, #17382f, #10231f);
  color: #70f0b2;
  box-shadow:
    0 0 8px rgba(81,228,155,.25),
    0 0 23px rgba(81,228,155,.16),
    7px 6px 18px rgba(0,0,0,.3);
}

#rocket.active .rocket-label {
  color: #83f2bb;
}

@media (max-width: 540px) {
  body {
    padding-right: 38px;
  }

  .content {
    padding: 8px;
  }

  .section {
    padding: 9px;
  }

  .subscription-actions {
    gap: 5px;
  }

  .subscription-actions .ghost-button {
    padding: 0 6px;
    font-size: 9px;
  }

  .exceptions-layout {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 6px;
  }

  .connection-buttons {
    grid-template-columns: 1fr 1fr;
  }

  .connection-buttons .secondary-button {
    grid-column: 1 / -1;
  }

  .external-ip {
    max-width: 52%;
  }

  #rocket {
    width: 62px;
  }
}

/* Updated brand title */
.titlebar {
  min-height: 62px;
  height: auto;
  padding-top: 9px;
  padding-bottom: 9px;
  gap: 9px;
}
.brand-name {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 1.8px;
  color: #f3faff;
  -webkit-text-stroke: .35px #78c9ff;
  text-shadow: 0 0 3px #fff, 0 0 8px #168bff, 0 0 18px #0877ff;
}
.brand-subtitle {
  margin-left: 2px;
  color: #aeb9ca;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0;
  text-shadow: none;
}


/* Cyber Purple: фиолетово-голубой киберпанк */
:root {
  --accent: #a783ff;
  --accent-soft: rgba(167,131,255,.16);
  --border: #40365f;
}
.brand-name {
  -webkit-text-stroke: .35px #d3baff;
  text-shadow: 0 0 3px #fff, 0 0 8px #b78aff, 0 0 18px #8d4dff, 0 0 30px rgba(141,77,255,.55);
}
#window {
  border-color: #57417d;
  box-shadow: 0 0 0 1px rgba(160,100,255,.12), 0 0 26px rgba(120,50,255,.14), 0 18px 55px rgba(0,0,0,.42);
}
.section {
  border-color: #342d4d;
  box-shadow: inset 0 0 0 1px rgba(167,131,255,.045), 0 0 14px rgba(134,73,255,.045);
}
.section-heading svg { color: #bca2ff; filter: drop-shadow(0 0 5px rgba(167,131,255,.65)); }
.segment.active {
  border-color: #7754ba;
  background: linear-gradient(180deg, #2b2345, #211a36);
  color: #d9c9ff;
  box-shadow: 0 0 12px rgba(146,86,255,.15);
}
.primary-button {
  border-color: #8c6ad6;
  background: linear-gradient(180deg, #7651c5, #51369a);
  box-shadow: 0 0 15px rgba(141,77,255,.2);
}
.server-row.selected td:first-child { box-shadow: inset 2px 0 #b18bff; }
.process-item.selected { border-color: #65518f; background: #211c34; color: #d9c9ff; }
.process-item.selected .process-dot { background: #b18bff; box-shadow: 0 0 8px rgba(177,139,255,.7); }
#rocket.active {
  border-color: #b06aff;
  background: linear-gradient(145deg, #302047, #1b1428);
  color: #d7b5ff;
  box-shadow: 0 0 10px rgba(176,106,255,.3), 0 0 25px rgba(176,106,255,.2), 7px 6px 18px rgba(0,0,0,.3);
}


/* Списки фиксированной высоты (прокрутка внутри) - окно не меняет размер,
   подложка-свечение всегда совпадает с карточкой. */
.server-table-wrap {
  height: 164px;
  overflow: auto;
  border-radius: 6px;
}

/* ---- app-обёртка: страница = окно приложения ---- */
/* Свечение и градиенты - из макета; отличается только обёртка: фон страницы
   прозрачный (окно frameless) и поля-прозрачка, чтобы glow не обрывался
   краем окна. */
html, body {
  background: transparent;
  min-height: 0;
}
/* Тень карточки из макета (0 18px 55px rgba(0,0,0,.42)) рисует по полям
   полупрозрачную подложку (alpha 6...53) - окно ловило клики, и по
   прозрачному нельзя было доткнуться до рабочего стола/игры (просьба 13.10).
   Убираем: поля становятся честно прозрачными (alpha=0), клик идёт сквозь.
   Неоновая кайма ::before остаётся - узкое кольцо вдоль карточки. */
#window { box-shadow: none !important; }
body {
  /* поля-прозрачка: неоновая кайма (blur 9) должна угасать, а не обрываться
     краем окна; справа ещё место под ракету и её тень */
  padding: 44px 96px 44px 44px;
  overflow: hidden;
  user-select: none;
}
#app-shell { margin: 0; }
input, .process-item, .server-row td { user-select: text; }

/* ---- скроллбары (списки процессов и серверов) ---- */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #0b1017; }
::-webkit-scrollbar-thumb {
  border: 2px solid #0b1017;
  border-radius: 6px;
  background: #2c3646;
}
::-webkit-scrollbar-thumb:hover { background: #3b4759; }

/* ---- выпадающий список процессов ---- */
#processDrop {
  position: absolute;
  z-index: 40;
  max-height: 190px;
  overflow: auto;
  border: 1px solid #40365f;
  border-radius: 6px;
  background: #0b1017;
  box-shadow: 0 10px 26px rgba(0, 0, 0, .5);
}
#processDrop[hidden] { display: none; }
#processDrop .drop-item {
  padding: 5px 9px;
  color: #aebacc;
  font-family: Consolas, "Courier New", monospace;
  font-size: 10px;
  white-space: nowrap;
  cursor: pointer;
}
#processDrop .drop-item:hover {
  background: #211c34;
  color: #d9c9ff;
}

/* ---- модальные окна (бывшие QMessageBox) ---- */
#modalLayer {
  position: fixed;
  z-index: 90;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  /* 15.10 (просьба): затемняющей подложки нет - только карточка
     уведомления; слой по-прежнему перехватывает клики, пока окно открыто */
  background: transparent;
}
#modalLayer[hidden] { display: none; }
.modal-card {
  width: 380px;
  max-width: calc(100% - 40px);
  padding: 16px 16px 13px;
  border: 1px solid #40365f;
  border-radius: 12px;
  background: linear-gradient(145deg, #171d28, #121822);
  box-shadow: 0 0 0 1px rgba(160, 100, 255, .12), 0 18px 55px rgba(0, 0, 0, .55);
}
.modal-title {
  margin: 0 0 8px;
  color: #e8edf5;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .6px;
}
.modal-text {
  margin: 0;
  color: #b9c5d5;
  font-size: 11px;
  line-height: 1.5;
  white-space: pre-wrap;
  user-select: text;
}
.modal-text.error { color: #ff8b98; }
.modal-actions {
  margin-top: 14px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.modal-actions button { width: auto; min-width: 92px; }

/* ---- перетаскивание окна ---- */
.titlebar { -webkit-app-region: drag; }
.titlebar button, .titlebar input { -webkit-app-region: no-drag; }

/* ---- служебное ---- */
.is-busy { opacity: .6; }

</style>
</head>
<body>
<div id="app-shell">
  <div id="window">
    <header class="titlebar">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 20 7v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <span class="brand-name">VPN ЛАУНЧЕР</span>
      <span class="brand-subtitle">by YoncFall</span>
      <div class="titlebar-spacer"></div>
      <span class="window-light" aria-hidden="true"></span>
      <button class="window-control" id="btnMinimize" type="button" title="Свернуть" aria-label="Свернуть" data-demo="Свернуть окно">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M5 12h14"/>
        </svg>
      </button>
      <button class="window-control close" id="btnClose" type="button" title="Закрыть" aria-label="Закрыть" data-demo="Закрыть окно">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </header>

    <main class="content">
      <section class="section">
        <h2 class="section-heading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1l-1.7 1.7"/>
            <path d="M14 11a5 5 0 0 0-7.1 0l-3 3A5 5 0 0 0 11 21.1l1.7-1.7"/>
          </svg>
          Подписка
        </h2>
        <div class="subscription-row">
          <div class="subscription-input-wrap">
            <input
              id="subscriptionUrl"
              class="text-input"
              type="password"
              value="https://example.com/subscription/config"
              autocomplete="off"
              spellcheck="false"
              aria-label="Ссылка подписки"
            >
            <button class="eye-button" id="toggleSubscriptionVisibility" type="button" title="Показать или скрыть ссылку" aria-label="Показать или скрыть ссылку">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="subscription-actions">
          <button class="ghost-button" id="btnLoad" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v12m-5-5 5 5 5-5"/>
              <path d="M5 16v4h14v-4"/>
            </svg>
            Загрузить подписку
          </button>
          <button class="ghost-button" id="btnPing" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12h4l3-8 5 16 3-8h5"/>
            </svg>
            Проверить пинг
          </button>
          <button class="ghost-button" id="btnLog" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 3h10l4 4v14H5z"/>
              <path d="M14 3v5h5M8 12h8M8 16h8"/>
            </svg>
            Открыть лог
          </button>
        </div>
      </section>

      <section class="section">
        <h2 class="section-heading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
          </svg>
          Серверы
        </h2>
        <p class="servers-hint">Выбери сервер · пусто — авто-тест всех</p>
        <div class="server-table-wrap">
        <table class="server-table">
          <thead>
            <tr>
              <th>ПРОТОКОЛ</th>
              <th>СЕРВЕР</th>
              <th>ПИНГ</th>
            </tr>
          </thead>
          <tbody id="serverList"></tbody>
        </table>
        </div>
      </section>

      <section class="section">
        <h2 class="section-heading" id="appSecHeading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v18M3 12h18"/>
            <circle cx="12" cy="12" r="8"/>
          </svg>
          Исключения
        </h2>

        <div class="exception-segments" role="group" aria-label="Режим исключений">
          <button class="segment active" type="button" data-exclusion-mode="exclude">
            <input type="radio" name="exceptionMode" checked tabindex="-1">
            Всё, кроме списка
          </button>
          <button class="segment" type="button" data-exclusion-mode="include">
            <input type="radio" name="exceptionMode" tabindex="-1">
            Только выбранные
          </button>
        </div>

        <div class="exceptions-layout">
          <div class="process-list-wrap">
            <div class="process-list" id="processList" aria-label="Список процессов"></div>
          </div>

          <div class="process-picker" id="processPickerWrap">
            <input
              class="text-input"
              id="processInput"
              type="text"
              placeholder="Выбрать процесс..."
              autocomplete="off"
              spellcheck="false"
              aria-label="Имя процесса"
            >
            <button class="secondary-button add-button" id="addProcess" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              Добавить
            </button>
            <div class="process-bottom-actions">
              <button class="secondary-button" id="removeProcess" type="button">Удалить</button>
              <button class="secondary-button" id="clearProcesses" type="button">Очистить</button>
            </div>
          </div>
        </div>

        <p class="section-hint" id="appsHint">Список процессов обновляется при запуске</p>
      </section>

      <section class="section connection-section">
        <h2 class="section-heading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 20 7v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z"/>
            <path d="M12 8v4l3 2"/>
          </svg>
          Подключение
        </h2>

        <div class="mode-segments" role="group" aria-label="Режим подключения">
          <button class="segment active" type="button" data-connection-mode="tun">
            <input type="radio" name="connectionMode" checked tabindex="-1">
            Весь трафик — TUN (админ)
          </button>
          <button class="segment" type="button" data-connection-mode="proxy">
            <input type="radio" name="connectionMode" tabindex="-1">
            Системный прокси
          </button>
        </div>

        <div class="connection-buttons">
          <button class="primary-button" id="connectButton" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
            ПОДКЛЮЧИТЬСЯ
          </button>
          <button class="danger-button" id="disconnectButton" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="5" width="14" height="14" rx="2"/>
            </svg>
            ОТКЛЮЧИТЬ
          </button>
          <button class="secondary-button" id="checkConfigButton" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 12 4 4L19 6"/>
            </svg>
            Проверить конфиг
          </button>
        </div>

        <div class="connection-status">
          <div class="status-group">
            <span class="status-item">
              <span class="status-lamp ready" id="connectionLamp"></span>
              <span id="connectionStatusText">Готов</span>
            </span>
            <span class="status-item">
              <span class="status-lamp dpi-inactive" id="dpiLamp"></span>
              <span>DPI</span>
            </span>
          </div>
          <span class="external-ip" id="externalIp">Внешний IP: недоступен</span>
        </div>
      </section>
    </main>
  </div>

  <button id="rocket" type="button" aria-label="Переключить DPI" title="Переключить DPI">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15c3-1 6-5 7-12-7 1-11 4-12 7l-1 5 6 0Z"/>
      <path d="m8 14-4 1-2 5 5-2 1-4ZM12 15l1 5 4-3 1-4"/>
      <circle cx="14" cy="8" r="2"/>
    </svg>
    <span class="rocket-label">DPI</span>
  </button>
</div>

<div id="modalLayer" hidden></div>
<div id="processDrop" hidden></div>
<script src="app.js"></script>
</body>
</html>
